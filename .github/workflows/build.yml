# Builds the desktop installers. This workflow has not been run yet; the Windows build in particular is untested.
# The execution tests (npm test) need many language toolchains and are run on a developer machine instead.
# Started by hand (Actions > Build desktop app > Run workflow)
# or by pushing a tag such as v0.1.0. The installers are attached to the run as artifacts.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ide/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Backend tests
        working-directory: apps/ide/src-tauri
        run: cargo test
      - name: Build installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/ide/src-tauri/target/release/bundle/dmg/*.dmg
            apps/ide/src-tauri/target/release/bundle/nsis/*.exe
            apps/ide/src-tauri/target/release/bundle/msi/*.msi
